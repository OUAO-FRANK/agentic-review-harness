services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_review_harness
      POSTGRES_USER: agentic_review_harness
      POSTGRES_PASSWORD: ${AGENTIC_REVIEW_POSTGRES_PASSWORD:?Set AGENTIC_REVIEW_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_review_harness"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  agentic-review-harness:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      EVOAGENT_HOST: 0.0.0.0
      EVOAGENT_DATABASE_URL: postgresql://agentic_review_harness:${AGENTIC_REVIEW_POSTGRES_PASSWORD:?Set AGENTIC_REVIEW_POSTGRES_PASSWORD in .env}@postgres:5432/agentic_review_harness
      EVOAGENT_REDIS_URL: redis://redis:6379/0
      EVOAGENT_ASYNC_WORKERS: 4
      EVOAGENT_SKILLS_DIR: /app/skills
      EVOAGENT_AUTH_REQUIRED: "true"
      EVOAGENT_AUTH_SECRET: ${EVOAGENT_AUTH_SECRET:?Set a random EVOAGENT_AUTH_SECRET in .env}
      EVOAGENT_BOOTSTRAP_ADMIN_USERNAME: ${EVOAGENT_BOOTSTRAP_ADMIN_USERNAME:?Set EVOAGENT_BOOTSTRAP_ADMIN_USERNAME in .env}
      EVOAGENT_BOOTSTRAP_ADMIN_PASSWORD: ${EVOAGENT_BOOTSTRAP_ADMIN_PASSWORD:?Set a strong EVOAGENT_BOOTSTRAP_ADMIN_PASSWORD in .env}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
